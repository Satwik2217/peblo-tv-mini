name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: |
          cd backend
          ruff check app/

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peblo
          POSTGRES_PASSWORD: peblo
          POSTGRES_DB: peblo_tv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peblo -d peblo_tv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://peblo:peblo@localhost:5432/peblo_tv_test
          JWT_SECRET: test-secret
          STORAGE_BACKEND: local
          STORAGE_PATH: /tmp/test-storage
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [cms, viewer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        run: |
          cd ${{ matrix.app }}
          npm install
          npx tsc --noEmit
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker compose build --no-cache
