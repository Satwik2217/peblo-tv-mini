services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo
      POSTGRES_DB: peblo_tv
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo_tv"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://peblo:peblo@db:5432/peblo_tv
      DATABASE_URL_SYNC: postgresql://peblo:peblo@db:5432/peblo_tv
      JWT_SECRET: dev-secret-change-in-production
      STORAGE_BACKEND: local
      STORAGE_PATH: /app/storage
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      API_URL: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - ./given files:/app/given files:ro

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api

  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
  storage_data:
